<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Generator</title><style>body{font-family:Arial;background:#f4f7f9}.box{max-width:650px;margin:30px auto;background:white;padding:25px;border-radius:16px}input,button{padding:12px;margin:6px;width:90%}button{background:#0b6b4f;color:white;border:0;border-radius:8px}.item{border-top:1px solid #ddd;padding:12px}</style></head><body><div class=box><h2>📱 Swachhata QR Generator</h2><input id=name placeholder="સ્થળ નામ - ઉદાહરણ: Sardar Baug"><input id=ward placeholder="Ward નંબર"><input id=code placeholder="QR Code - ઉદાહરણ: WARD-05"><button onclick=create()>QR બનાવો</button><div id=out></div><hr><div id=list></div></div><script>async function create(){let r=await fetch('/api/qr-points',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,ward:ward.value,code:code.value})});let x=await r.json();out.innerHTML=`<p>Code: <b>${x.code}</b></p><img width=260 src="/api/qr/${x.code}"><p>Print URL: /api/qr/${x.code}</p>`;load()}async function load(){let a=await (await fetch('/api/qr-points')).json();list.innerHTML=a.map(x=>`<div class=item><b>${x.name}</b> • Ward ${x.ward} • ${x.code}<br><img width=120 src="/api/qr/${x.code}"></div>`).join('')}load()</script></body></html>
