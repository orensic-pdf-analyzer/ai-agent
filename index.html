<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Swachhata Dashboard</title><style>body{font-family:Arial,sans-serif;background:#f4f7f9;margin:0;color:#17324d}.top{background:#0b6b4f;color:white;padding:22px 28px}.wrap{max-width:1200px;margin:auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:white;border-radius:14px;padding:18px;box-shadow:0 3px 12px #0001}.num{font-size:30px;font-weight:700}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input,select,button{padding:11px;border:1px solid #ccd6df;border-radius:8px}button{background:#0b6b4f;color:white;border:0;cursor:pointer}table{width:100%;border-collapse:collapse;background:white}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}th{background:#e9f3ef}.pill{padding:5px 8px;border-radius:15px;background:#eee}.qr{margin-top:20px}</style></head><body><div class="top"><div class="wrap"><h1>🏛️ છોટાઉદેપુર નગરપાલિકા</h1><div>AI Swachhata • WhatsApp Agent • QR Complaint System</div></div></div><main class="wrap"><div class="cards"><div class="card">કુલ ફરિયાદો<div class="num" id="total">0</div></div><div class="card">Pending<div class="num" id="pending">0</div></div><div class="card">In Progress<div class="num" id="inprogress">0</div></div><div class="card">Resolved<div class="num" id="resolved">0</div></div></div><div class="toolbar"><input id="from" type="date"><input id="to" type="date"><input id="ward" placeholder="Ward"><select id="status"><option value="">બધા Status</option><option>Pending</option><option>In Progress</option><option>Resolved</option></select><button onclick="load()">Filter</button><button onclick="location.href='qr.html'">QR Generator</button></div><div class="card"><table><thead><tr><th>ID</th><th>Phone</th><th>Category</th><th>Location</th><th>Ward</th><th>Priority</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>async function load(){let q=new URLSearchParams();['from','to','ward','status'].forEach(x=>{let v=document.getElementById(x).value;if(v)q.set(x,v)});let r=await fetch('/api/complaints?'+q);let a=await r.json();rows.innerHTML=a.map(x=>`<tr><td>${x.complaint_no}</td><td>${x.citizen_phone}</td><td>${x.category}</td><td>${x.location||'-'}</td><td>${x.ward||'-'}</td><td>${x.priority}</td><td><span class=pill>${x.status}</span></td><td><button onclick="upd(${x.id},'In Progress')">Start</button> <button onclick="upd(${x.id},'Resolved')">Close</button></td></tr>`).join('')}async function upd(id,status){await fetch('/api/complaints/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load();stats()}async function stats(){let x=await (await fetch('/api/stats')).json();for(let k of ['total','pending','inprogress','resolved'])document.getElementById(k).textContent=x[k]}load();stats();</script></body></html>
