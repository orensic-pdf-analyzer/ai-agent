<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swachhata Complaint</title><style>body{font-family:Arial;background:#eef6f1;margin:0}.box{max-width:600px;margin:30px auto;background:white;padding:25px;border-radius:18px;box-shadow:0 5px 20px #0002}input,textarea,button{width:100%;padding:13px;margin:8px 0;box-sizing:border-box;border-radius:8px;border:1px solid #ccc}button{background:#0b6b4f;color:white;border:0}</style></head><body><div class=box><h2>🧹 સ્વચ્છતા ફરિયાદ</h2><p>તમારી ફરિયાદ માટે માહિતી ભરો. AI આપમેળે ફરિયાદનું વર્ગીકરણ કરશે.</p><input id=name placeholder="તમારું નામ"><input id=phone placeholder="WhatsApp મોબાઇલ નંબર"><input id=ward placeholder="Ward નંબર"><input id=location placeholder="સ્થળ / Location"><textarea id=description placeholder="ફરિયાદ વિગત"></textarea><button onclick=send()>ફરિયાદ નોંધાવો</button><div id=out></div></div><script>let qr=new URLSearchParams(location.search).get('qr')||'';async function send(){let b={name:name.value,phone:phone.value,ward:ward.value,location:location.value,description:description.value,qr_code:qr};let r=await fetch('/api/complaints',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let x=await r.json();out.innerHTML=x.ok?`<h3>✅ ફરિયાદ નોંધાઈ</h3><b>${x.complaint_no}</b><p>આ નંબર સાચવી રાખો.</p>`:`Error`;}</script></body></html>
